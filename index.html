<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Номера</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Russo+One&family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:radial-gradient(90% 55% at 50% 38%,#4a2391,#170b34 62%,#07040f);color:#fff;font:14px Sora,sans-serif;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0)}
body:before{content:"";position:fixed;left:50%;top:38%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(rgba(255,200,80,.12) 0 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(circle,#000,transparent 62%);mask:radial-gradient(circle,#000,transparent 62%);pointer-events:none}
.ru{font-family:"Russo One",sans-serif;font-weight:400}.o{font-family:Oswald,sans-serif}
#top{position:relative;display:flex;gap:8px;padding:12px 14px 0}
.pill{display:flex;align-items:center;gap:8px;background:#0b0618bb;border:1px solid #ffffff2a;border-radius:22px;padding:5px 12px 5px 5px;font:600 15px Sora}
.coin{width:26px;height:26px;border-radius:50%;background:linear-gradient(#ffe08a,#e8a317);color:#5a3a00;display:flex;align-items:center;justify-content:center;font-size:14px}
#main{position:relative;flex:1;overflow-y:auto;padding:10px 16px;display:flex;flex-direction:column;align-items:center}
.b3{border:0;border-radius:20px;font:400 19px "Russo One",sans-serif;letter-spacing:.05em;color:#fff;width:100%;height:58px;margin-top:14px}
.b3:disabled{opacity:.45}.gold{background:linear-gradient(#ffd76a,#f5a300);box-shadow:0 6px 0 #a35f00,0 12px 26px #f5a30066;color:#3a2200}
.vio{background:linear-gradient(#9d6bff,#6a35e6);box-shadow:0 6px 0 #3b1a9c;height:50px;font-size:15px}
.sm{width:auto;height:38px;font-size:13px;padding:0 14px;margin:0;box-shadow:0 4px 0 #a35f00}.gr{background:#4b4470;box-shadow:0 4px 0 #2a2545;color:#fff}
.nav{position:relative;display:flex;justify-content:space-around;background:#0b0618;border-top:1px solid #ffffff18;padding:8px 0 calc(10px + env(safe-area-inset-bottom,0))}
.ni{display:flex;flex-direction:column;align-items:center;font:600 11px Sora;color:#8a84a8;background:none;border:0}.ni i{font-style:normal;font-size:20px}.on{color:#ffd76a}.on i{filter:drop-shadow(0 0 8px #f5a300)}
/* номер */
.pl{display:flex;align-items:stretch;background:linear-gradient(#e2e4e8,#aeb1b6);border:3px solid #15171a;border-radius:12px;color:#000;box-shadow:inset 0 0 0 2px #8a8d92}
.rg{border-left:3px solid #15171a;padding:.02em .2em .04em;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rs{display:flex;align-items:center;gap:.25em;font:700 .3em/1 Sora,sans-serif}.rs i{width:.95em;height:.64em;background:linear-gradient(#fff 33%,#1c4fb4 33% 66%,#d52b1e 66%);border:1px solid #444}
.mn{display:flex;align-items:center;padding:.06em .22em}.rr{display:flex;font-size:.78em}
.r{display:inline-block;width:.64em;height:1.1em;overflow:hidden;font:700 1em/1.1em Oswald,sans-serif;text-align:center;color:#000}.rr .r{width:.6em}.sp{width:.08em}
.r div{display:flex;flex-direction:column}.r b{height:1.1em;line-height:1.1em}
.t2{display:flex;align-items:center;padding:0 .3em;font:700 1em/1.15 Oswald,sans-serif;letter-spacing:.03em}.r2{font:700 .78em/1 Oswald,sans-serif}
#win{position:relative;width:100%;max-width:350px;height:190px;border-radius:26px;border:3px solid #ffd76a;background:#0b0618d9;box-shadow:0 0 44px var(--rc,#a855f755),inset 0 0 34px #000;display:flex;align-items:center;justify-content:center}
#win:before,#win:after{content:"";position:absolute;top:50%;margin-top:-14px;border:14px solid transparent}
#win:before{left:-2px;border-left:17px solid #ffd76a;border-right:0}#win:after{right:-2px;border-right:17px solid #ffd76a;border-left:0}
#plate{font-size:min(9.4vw,50px);border-radius:12px;transition:box-shadow .6s}
.card{width:100%;border-radius:18px;border:2px solid var(--c,#ffffff2a);background:linear-gradient(#1d1040,#110a28);box-shadow:0 0 18px var(--c,transparent);padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px}.bar{height:8px;background:#ffffff22;border-radius:4px;margin:8px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#34d399,#10b981)}
#wh{width:290px;height:290px;border-radius:50%;border:8px solid #ffd76a;box-shadow:0 0 44px #f5a30088,inset 0 0 30px #0008;position:relative}
#wh span{position:absolute;left:50%;top:50%;width:70px;margin:-12px 0 0 -35px;text-align:center;font:400 17px "Russo One";text-shadow:0 2px 4px #000}
#md{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
.cf{position:fixed;top:-14px;width:8px;height:12px;z-index:30;animation:fl 2.6s linear forwards}@keyframes fl{to{transform:translateY(110vh) rotate(720deg)}}
</style></head><body>
<div id="top"><div class="pill"><span class="coin">★</span><span id="s"></span></div><div class="pill"><span class="coin" style="background:linear-gradient(#b8f5c8,#2fb457);color:#073d1a">₽</span><span id="m"></span></div></div>
<div id="main"></div>
<div class="nav" id="nav"><button class="ni" onclick="go(0)"><i>◉</i>Рулетка</button><button class="ni" onclick="go(1)"><i>▤</i>Коллекция</button><button class="ni" onclick="go(2)"><i>♛</i>Топ</button><button class="ni" onclick="go(3)"><i>✦</i>Бонусы</button><button class="ni" onclick="go(4)"><i>◆</i>Магазин</button></div>
<div id="md"></div>
<script>
const BOT='ИМЯ_БОТА',$=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms)),rnd=a=>a[Math.random()*a.length|0],fmt=n=>Math.round(n).toLocaleString('ru-RU');
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand()}
const UID=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user?tg.initDataUnsafe.user.id:'demo';
const D='0123456789',L='АВЕКМНОРСТУХ',KIND='ldddllrrr';
const REG=['77','78','50','52','61','63','74','86','102','116','124','150','152','154','161','163','174','177','178','190','197','199','716','750','761','763','774','777','797','799'];
const TOP=['77','777','97','99','177','197','199','277','797','799','78','178','50','150','190','750','774'];
// f/p = шансы бесплатной/платной крутки (%), s = секунды счёта цены, r = диапазон цены ₽
const R=[{n:'ОБЫЧНЫЙ',c:'#9aa0a8',f:60,p:35,s:.8,r:[2e4,15e4]},{n:'РЕДКИЙ',c:'#3b82f6',f:25,p:28,s:1.2,r:[15e4,6e5]},{n:'ЭПИЧЕСКИЙ',c:'#a855f7',f:10,p:18,s:2,r:[6e5,2e6]},{n:'МИФИЧЕСКИЙ',c:'#ef4444',f:4,p:12,s:3,r:[2e6,8e6]},{n:'ЛЕГЕНДАРНЫЙ',c:'#f5b301',f:1,p:7,s:4.5,r:[8e6,3e7]}];
const Q=[[0,'Прокрути рулетку 20 раз','spins',20,1],[0,'Выбей 5 номеров «Редкие» или выше','rare',5,2],[0,'Продай 3 номера','sold',3,2],[0,'Открой коллекцию 3 раза','gar',3,1],[0,'Открой профиль игрока из топа','prof',1,1],[0,'Поделись выпавшим номером','share',1,2],[0,'Забери бонусное колесо','wheel',1,2],
[1,'Прокрути рулетку 100 раз','spins',100,5],[1,'Выбей 3 эпических номера или выше','epic',3,5],[1,'Продай 5 номеров','sold',5,3],[1,'Сделай 1 платную крутку','paid',1,3],[1,'Продай номеров на 5 000 000 ₽','soldsum',5e6,5],[1,'Прокрути рулетку 50 раз','spins',50,4],
[2,'Выбей легендарный номер','leg',1,10],[2,'Выбей мифический номер или выше','myth',1,7],[2,'Прокрути рулетку 300 раз','spins',300,10],[2,'Сделай 3 платные крутки','paid',3,8],[2,'Выбей номер дороже 20 000 000 ₽','big',1,15]];
const B=[['Макс_Drive',[['О777ОО777',2.4e7,4],['А001АА199',1.1e7,4]]],['Анна',[['К555НК77',4.2e6,3],['Е121ХС50',9e5,2]]],['Ильдар',[['М333МН174',2.8e6,3],['В123ВВ63',7e5,2]]],['Сергей',[['Х112ОР52',2e5,1]]],['Kolya99',[['А845РТ61',4e4,0]]]];
let S={s:40,m:0,g:[],w:0,q:{day:'',prog:{},claimed:{},ids:[]}},busy=0,T=0,cur=0,last=null;
try{Object.assign(S,JSON.parse(localStorage.getItem('np2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('np2',JSON.stringify(S))}catch(e){}},bal=()=>{$('s').textContent=S.s;$('m').textContent=fmt(S.m)};
const tr=(k,n=1)=>{S.q.prog[k]=(S.q.prog[k]||0)+n;save()};
const today=()=>new Date(Date.now()+108e5).toISOString().slice(0,10);
// ---- Номера: генерация и редкость ----
function rate(t){const d=t.slice(1,4);let q=0;
 if(d[0]==d[1]&&d[1]==d[2])q=d=='777'?4:3;else if(d[0]==d[1]||d[1]==d[2]||d[0]==d[2])q=1;
 if(q<3&&(d[0]==d[2]||(+d[1]==+d[0]+1&&+d[2]==+d[1]+1)))q=Math.max(q,2);
 if(TOP.includes(t.slice(6).trim()))q=Math.min(4,q+1);return q}
function make(){let d;do{d=[0,1,2].map(()=>rnd(D)).join('')}while(d=='000');const r=rnd(REG);return rnd(L)+d+rnd(L)+rnd(L)+(r.length==2?r+'\u00a0':r)}
function force(q){let t;for(let i=0;i<9000;i++){t=make();if(rate(t)==q)return t}return t}
const roll=p=>{let x=Math.random()*100,i=0;for(;i<4;i++){x-=R[i][p?'p':'f'];if(x<0)break}return i};
const price=q=>{const [a,b]=R[q].r;return Math.round((a+Math.random()*(b-a))/1e3)*1e3};
const pn=t=>t.slice(0,6)+' '+t.slice(6).trim();
const pool=(k,i)=>k=='l'?L:k=='r'&&i==6?'1234567':D;
const cell=c=>`<span class="r"><div><b>${c}</b></div></span>`;
function build(t){$('plate').innerHTML=`<div class="pl"><div class="mn">${[...t.slice(0,4)].map(cell).join('')}<span class="sp"></span>${[...t.slice(4,6)].map(cell).join('')}</div><div class="rg"><div class="rr">${[...t.slice(6)].map(cell).join('')}</div><div class="rs">RUS<i></i></div></div></div>`}
const spl=(t,c,fs=26)=>`<div class="pl" style="font-size:${fs}px;box-shadow:inset 0 0 0 2px #8a8d92,0 0 16px ${c}"><div class="t2">${t.slice(0,6)}</div><div class="rg" style="padding:0 .25em"><div class="r2">${t.slice(6).trim()}</div><div class="rs">RUS<i></i></div></div></div>`;
// ---- Задания ----
function seed(s){let h=0;for(const c of s)h=Math.imul(31,h)+c.charCodeAt(0)|0;return()=>{h=h+0x6D2B79F5|0;let t=Math.imul(h^h>>>15,1|h);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function dayQ(day,prev){const r=seed(day),o=[];[[0,2],[1,2],[2,1]].forEach(([d,n])=>{const a=Q.map((q,i)=>i).filter(i=>Q[i][0]==d&&!prev.includes(i));while(n--)o.push(a.splice(r()*a.length|0,1)[0])});return o}
function newDay(){const p=S.q.ids||[];S.q={day:today(),prog:{},claimed:{},ids:dayQ(today(),p)};save()}
// ---- Общее ----
const md=h=>{$('md').innerHTML='<div class="card" style="--c:#ffd76a;max-width:330px;text-align:center">'+h+'<button class="b3 gold" onclick="cl()">OK</button></div>';$('md').style.display='flex'},cl=()=>{$('md').style.display='none'};
function ask(h,fn){window._f=fn;$('md').innerHTML='<div class="card" style="--c:#ffd76a;max-width:330px;text-align:center">'+h+'<button class="b3 gold" onclick="cl();_f()">Да</button><button class="b3 vio" onclick="cl()">Отмена</button></div>';$('md').style.display='flex'}
function confetti(){for(let i=0;i<40;i++){const d=document.createElement('div');d.className='cf';d.style.left=Math.random()*100+'vw';d.style.background=rnd(['#f5b301','#ef4444','#3b82f6','#10b981']);d.style.animationDelay=Math.random()*.6+'s';document.body.append(d);setTimeout(()=>d.remove(),3600)}}
function share(t){tr('share');const u='https://t.me/share/url?url='+encodeURIComponent('https://t.me/'+BOT)+'&text='+encodeURIComponent(t);tg&&tg.openTelegramLink?tg.openTelegramLink(u):window.open(u,'_blank')}
function add(q,t,p){const o={u:Math.random().toString(36).slice(2),t,q,p};S.g.push(o);if(q>=1)tr('rare');if(q>=2)tr('epic');if(q>=3)tr('myth');if(q==4)tr('leg');if(p>2e7)tr('big');save();return o}
function sell(u){const i=S.g.findIndex(c=>c.u==u);if(i<0)return;const c=S.g.splice(i,1)[0];S.m+=c.p;tr('sold');tr('soldsum',c.p);bal();save()}
function cs(u){const c=S.g.find(x=>x.u==u);if(c)ask(`Продать номер ${pn(c.t)} за ${fmt(c.p)} ₽?`,()=>{sell(u);vg()})}
function go(t){if(busy)return;T=t;[...$('nav').children].forEach((b,i)=>b.classList.toggle('on',i==t));if(t==1)tr('gar');[vr,vg,vt,vb,vm][t]()}
// ---- Рулетка ----
function vr(){$('main').innerHTML=`<div class="ru" id="rt" style="font-size:26px;margin-top:4px">КРУТИ НОМЕР</div><div id="pr" class="ru" style="font-size:34px;color:#ffe08a;height:46px;opacity:0;transition:opacity .6s">&nbsp;</div><div id="win"><div id="plate"></div></div><div id="ac" style="margin-top:12px"></div><button class="b3 gold" id="b1" onclick="spin(0)">КРУТИТЬ БЕСПЛАТНО</button><button class="b3 vio" id="b2" onclick="spin(1)">КРУТИТЬ ЗА 20 ★ · ШАНС ВЫШЕ</button><div style="font-size:11px;color:#b9b0e0;margin-top:12px;text-align:center">Шансы (беспл./платно): ${R.map(r=>r.n.slice(0,4)+' '+r.f+'/'+r.p+'%').join(' · ')}</div>`;build('К774КС774')}
const count=(el,to,ms,col,gl)=>new Promise(r=>{const t0=performance.now();el.style.color=gl?col:'#ffe08a';(function f(n){const p=Math.min((n-t0)/ms,1);el.textContent=fmt(to*(1-Math.pow(1-p,3)))+' ₽';if(p<1)requestAnimationFrame(f);else{if(gl)el.animate([{transform:'scale(1.3)'},{transform:'scale(1)'}],350);r()}})(t0)});
async function spin(p){if(busy)return;if(p){if(S.s<20)return md('Не хватает ★ для платной крутки.');S.s-=20;tr('paid')}
 busy=1;$('b1').disabled=$('b2').disabled=true;$('ac').innerHTML='';bal();
 const q=roll(p),fin=force(q),pr=$('pr'),reels=[...document.querySelectorAll('.r')];let done=0;
 pr.style.opacity=0;pr.textContent='\u00a0';$('rt').textContent='КРУТИМ...';$('rt').style.color='#fff';$('plate').style.boxShadow='none';$('win').style.removeProperty('--rc');
 await new Promise(res=>reels.forEach((r,i)=>{const n=14+i*4,it=[fin[i]];for(let j=0;j<n;j++)it.push(rnd(pool(KIND[i],i)));const dv=r.firstElementChild;dv.innerHTML=it.map(x=>`<b>${x}</b>`).join('');
  dv.animate([{transform:`translateY(${-n*1.1}em)`},{transform:'translateY(0)'}],{duration:1600+i*380,easing:'cubic-bezier(.12,.75,.2,1)',fill:'forwards'}).onfinish=()=>{if(++done==reels.length)res()}}));
 $('rt').textContent=R[q].n;$('rt').style.color=R[q].c;$('win').style.setProperty('--rc',R[q].c);$('plate').style.boxShadow=`0 0 ${10+q*10}px ${R[q].c}`;
 if(q==4){await sleep(500);confetti()}
 const pc=price(q);pr.style.opacity=1;await count(pr,pc,R[q].s*1000,R[q].c,q>=3);
 last=add(q,fin,pc);tr('spins');bal();
 $('ac').innerHTML=`<div class="row"><button class="b3 gold sm" onclick="sellLast()">ПРОДАТЬ</button><button class="b3 gr sm" onclick="share('Мне выпал номер ${pn(fin)} за ${fmt(pc)} ₽!')">ПОДЕЛИТЬСЯ</button></div>`;
 $('b1').disabled=$('b2').disabled=false;busy=0}
function sellLast(){if(last){sell(last.u);last=null;$('ac').innerHTML=''}}
// ---- Коллекция ----
function vg(){const tot=S.g.reduce((a,c)=>a+c.p,0);$('main').innerHTML=`<div class="ru" style="font-size:26px;align-self:flex-start">КОЛЛЕКЦИЯ</div><div style="align-self:flex-start;color:#b9b0e0;margin:4px 0 12px">${S.g.length} номеров · стоимость <b class="ru" style="color:#ffe08a">${fmt(tot)} ₽</b></div>`+(S.g.length?S.g.slice().reverse().map(c=>`<div class="card" style="--c:${R[c.q].c}"><div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="ru" style="color:${R[c.q].c}">${R[c.q].n}</span><span class="ru" style="color:#ffe08a">${fmt(c.p)} ₽</span></div><div style="display:flex;justify-content:center">${spl(c.t,R[c.q].c)}</div><div class="row" style="margin-top:12px"><button class="b3 gold sm" onclick="cs('${c.u}')">ПРОДАТЬ</button><button class="b3 gr sm" onclick="share('Мой номер ${pn(c.t)} в игре!')">ПОДЕЛИТЬСЯ</button></div></div>`).join(''):'<p style="color:#b9b0e0;margin-top:60px">Пусто. Крути рулетку!</p>')}
// ---- Топ ----
function vt(){const e=B.map(([n,l])=>({n,l:l.map(([t,p,q])=>({t,p,q}))}));e.push({n:'Вы',l:S.g});e.forEach(x=>x.t=x.l.reduce((a,c)=>a+c.p,0));window._e=e.sort((a,b)=>b.t-a.t);
 $('main').innerHTML='<div class="ru" style="font-size:26px;align-self:flex-start">ТОП ИГРОКОВ</div><p style="color:#b9b0e0;font-size:12px;margin:4px 0 12px;align-self:flex-start">Демо-рейтинг. Общий топ работает с сервером.</p>'+_e.map((x,i)=>`<div class="card row" onclick="prof(${i})"><b class="ru" style="flex:1">${i+1}. ${x.n}</b><span class="ru" style="color:#ffe08a">${fmt(x.t)} ₽</span></div>`).join('')}
function prof(i){tr('prof');const x=_e[i];md(`<b class="ru">${x.n}</b><br><small>${fmt(x.t)} ₽ · номеров: ${x.l.length}</small><div style="max-height:45vh;overflow:auto;margin-top:10px;display:flex;flex-direction:column;gap:10px;align-items:center">${x.l.map(c=>spl(c.t,R[c.q].c,22)).join('')||'<small>Пусто</small>'}</div>`)}
// ---- Бонусы ----
const W=['★5','МИФ','★10','ЛЕГ','★50'],WC=['#3b82f6','#ef4444','#8b5cf6','#f5b301','#10b981'],P=[50,14,30,3,3];
function vb(){const ok=Date.now()-S.w>=864e5,g=WC.concat(WC).map((c,i)=>`${c} ${i*36}deg ${i*36+36}deg`).join(','),link=`https://t.me/${BOT}?start=ref_${UID}`;
 $('main').innerHTML=`<div class="ru" style="font-size:26px;color:#ffe08a">КОЛЕСО УДАЧИ</div><div style="position:relative;margin:28px 0 8px"><div style="position:absolute;left:50%;top:-22px;margin-left:-16px;border-top:30px solid #ef4444;border-left:16px solid transparent;border-right:16px solid transparent;z-index:3"></div><div id="wh" style="background:conic-gradient(${g});transform:rotate(${cur}deg)">${Array.from({length:10},(_,k)=>`<span style="transform:rotate(${k*36+18}deg) translateY(-108px)">${W[k%5]}</span>`).join('')}</div></div><button class="b3 gold" onclick="wheel()" ${ok?'':'disabled'}>${ok?'КРУТИТЬ КОЛЕСО':'ЧЕРЕЗ <span id="wt"></span>'}</button>
 <div class="ru" style="font-size:20px;align-self:flex-start;margin:22px 0 8px">ЗАДАНИЯ ДНЯ <small style="font:12px Sora;color:#b9b0e0">новые через <span id="qt"></span></small></div>`+
 S.q.ids.map(id=>{const [d,t,k,n,r]=Q[id],p=Math.min(S.q.prog[k]||0,n),c=S.q.claimed[id];return `<div class="card"><div class="row"><span style="flex:1">${t}</span><button class="b3 gold sm" ${p>=n&&!c?'':'disabled'} onclick="claim(${id})">${c?'ГОТОВО':'+'+r+' ★'}</button></div><div class="bar"><i style="width:${p/n*100}%"></i></div><small>${fmt(p)} / ${fmt(n)}</small></div>`}).join('')+
